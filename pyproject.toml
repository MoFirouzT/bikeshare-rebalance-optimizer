[project]
name = "bikeshare"
version = "0.1.0"
description = "Censored demand and network-priced repositioning for station-based bike share"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeshare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
